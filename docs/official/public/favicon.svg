<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FerrisGrid">
  <defs>
    <pattern id="checker" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 0h4v4H0zM4 4h4v4H4z" fill="#0b0b0f"/>
      <path d="M4 0h4v4H4zM0 4h4v4H0z" fill="#050507"/>
    </pattern>
    <filter id="violetGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="8" fill="#030306"/>
  <rect width="64" height="64" rx="8" fill="url(#checker)" opacity="0.7"/>

  <g stroke-linecap="square" stroke-linejoin="miter">
    <path d="M15 16h34v34H15z" fill="none" stroke="#c7a8ff" stroke-width="1.8" opacity="0.95"/>
    <path d="M15 26h34M15 38h34M26 16v34M38 16v34" stroke="#7c3aed" stroke-width="1" stroke-dasharray="1 3" opacity="0.85"/>

    <path d="M11 19v-6h6M47 13h6v6M53 45v6h-6M17 51h-6v-6" fill="none" stroke="#22d3ee" stroke-width="2.4" filter="url(#cyanGlow)"/>

    <path d="M21 32h22M32 21v22M22 22l20 20M42 22L22 42" stroke="#8b5cf6" stroke-width="2.4" filter="url(#violetGlow)"/>
    <path d="M21 22h22v20H21z" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.85" filter="url(#violetGlow)" transform="rotate(45 32 32)"/>

    <path d="M32 6v9M32 49v9M6 32h9M49 32h9" stroke="#22d3ee" stroke-width="1.6" opacity="0.9" filter="url(#cyanGlow)"/>

    <g fill="#05030a" stroke="#f7f2ff" stroke-width="2.2" filter="url(#violetGlow)">
      <path d="M27 27h10v10H27z"/>
      <path d="M15 27h10v10H15z"/>
      <path d="M39 27h10v10H39z"/>
      <path d="M27 15h10v10H27z"/>
      <path d="M27 39h10v10H27z"/>
    </g>

    <g fill="#05030a" stroke="#22d3ee" stroke-width="2" filter="url(#cyanGlow)">
      <path d="M12 13h6v6h-6z"/>
      <path d="M46 13h6v6h-6z"/>
      <path d="M12 46h6v6h-6z"/>
      <path d="M46 46h6v6h-6z"/>
    </g>

    <path d="M43 43h6v3h3v6h-6v-3h-3z" fill="#a3e635" stroke="#a3e635" stroke-width="1.8" filter="url(#cyanGlow)"/>
  </g>
</svg>
