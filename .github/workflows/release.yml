name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to package, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release-notes:
    name: Validate release notes
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate tagged release notes
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          notes_file="docs/official/releases/${TAG_NAME}.md"
          body_file="/tmp/github-release-notes.md"

          if [ ! -f "$notes_file" ]; then
            echo "Missing release notes file: $notes_file" >&2
            exit 1
          fi

          awk '
            /<!-- release-notes:start -->/ { emit=1; next }
            /<!-- release-notes:end -->/ { emit=0 }
            emit { print }
          ' "$notes_file" > "$body_file"

          if ! grep -q '[^[:space:]]' "$body_file"; then
            echo "Release notes file must contain non-empty content between release-notes markers" >&2
            exit 1
          fi

          github_release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}"
          if ! grep -Fq "$github_release_url" "$body_file"; then
            echo "Release notes file must link to $github_release_url" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    needs:
      - release-notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: ferrisgrid-x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary_ext: ""
            archive_ext: tar.gz
          - asset: ferrisgrid-aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary_ext: ""
            archive_ext: tar.gz
          - asset: ferrisgrid-x86_64-apple-darwin
            runner: macos-15-intel
            target: x86_64-apple-darwin
            binary_ext: ""
            archive_ext: tar.gz
          - asset: ferrisgrid-aarch64-apple-darwin
            runner: macos-15
            target: aarch64-apple-darwin
            binary_ext: ""
            archive_ext: tar.gz
          - asset: ferrisgrid-x86_64-pc-windows-msvc
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary_ext: ".exe"
            archive_ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo +stable build --release --locked -p ferrisgrid-cli --target ${{ matrix.target }}

      - name: Smoke test binary
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/ferrisgrid${{ matrix.binary_ext }}"
          "$bin" doctor --backend fake
          "$bin" observe --backend fake --output-dir .ferrisgrid-release-smoke

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          package="${{ matrix.asset }}"
          mkdir -p "dist/$package"
          cp "target/${{ matrix.target }}/release/ferrisgrid${{ matrix.binary_ext }}" "dist/$package/"
          cp README.md "dist/$package/"
          if [ -f LICENSE ]; then
            cp LICENSE "dist/$package/"
          fi
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            powershell -NoLogo -NoProfile -Command "Compress-Archive -Path \"dist/${package}/*\" -DestinationPath \"${package}.zip\" -Force"
          else
            tar -C dist -czf "${package}.tar.gz" "$package"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.${{ matrix.archive_ext }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs:
      - build
      - crates
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Generate checksums
        run: |
          find release-artifacts -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Extract release notes
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          notes_file="docs/official/releases/${TAG_NAME}.md"
          body_file="/tmp/github-release-notes.md"

          if [ ! -f "$notes_file" ]; then
            echo "Missing release notes file: $notes_file" >&2
            exit 1
          fi

          awk '
            /<!-- release-notes:start -->/ { emit=1; next }
            /<!-- release-notes:end -->/ { emit=0 }
            emit { print }
          ' "$notes_file" > "$body_file"

          if ! grep -q '[^[:space:]]' "$body_file"; then
            echo "Release notes file must contain non-empty content between release-notes markers" >&2
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          body_file="/tmp/github-release-notes.md"
          assets="$(find release-artifacts -type f | sort)"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" $assets SHA256SUMS --clobber
            gh release edit "$TAG_NAME" --notes-file "$body_file"
          else
            gh release create "$TAG_NAME" $assets SHA256SUMS --verify-tag --title "$TAG_NAME" --notes-file "$body_file"
          fi

  crates:
    name: Publish crates.io crates
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Publish crates
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          version="${TAG_NAME#v}"
          package_version="$(cargo +stable pkgid -p ferrisgrid-core | sed 's/.*#//')"
          if [ "$version" != "$package_version" ]; then
            echo "Release tag $TAG_NAME does not match package version $package_version" >&2
            exit 1
          fi

          crate_index_path() {
            local crate="$1"
            echo "${crate:0:2}/${crate:2:2}/${crate}"
          }

          is_published() {
            local crate="$1"
            local path
            path="$(crate_index_path "$crate")"
            curl -fsSL -A "ferrisgrid-release" "https://index.crates.io/${path}" 2>/dev/null \
              | grep -q "\"vers\":\"${version}\""
          }

          wait_until_published() {
            local crate="$1"
            for attempt in {1..18}; do
              if is_published "$crate"; then
                echo "$crate $version is available in the crates.io index"
                return 0
              fi
              echo "Waiting for $crate $version to reach the crates.io index ($attempt/18)"
              sleep 10
            done
            echo "$crate $version was published but did not appear in the index in time" >&2
            return 1
          }

          publish_crate() {
            local crate="$1"
            if is_published "$crate"; then
              echo "$crate $version is already published; skipping"
              return 0
            fi
            cargo +stable publish -p "$crate" --locked
            wait_until_published "$crate"
          }

          publish_crate ferrisgrid-core
          publish_crate ferrisgrid-capture
          publish_crate ferrisgrid-input
          publish_crate ferrisgrid-export
          publish_crate ferrisgrid-cli
