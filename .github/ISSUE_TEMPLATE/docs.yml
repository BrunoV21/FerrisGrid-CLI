name: Documentation fix
description: Report unclear docs, stale commands, broken links, or missing examples.
title: "Docs: "
labels:
  - documentation
body:
  - type: input
    id: page
    attributes:
      label: Page or section
      placeholder: "README.md, docs/official/getting-started/installation.md, ..."
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What should change?
      description: Describe the stale, missing, or confusing documentation.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording or example
