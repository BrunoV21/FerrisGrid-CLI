[workspace]
members = [
  "crates/ferrisgrid-cli",
  "crates/ferrisgrid-core",
  "crates/ferrisgrid-capture",
  "crates/ferrisgrid-input",
  "crates/ferrisgrid-record",
  "crates/ferrisgrid-export",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.3.0"
license = "MIT"
repository = "https://github.com/BrunoV21/FerrisGrid-CLI"
readme = "README.md"
keywords = ["automation", "screen", "coordinates", "agent", "cli"]
categories = ["command-line-utilities"]
